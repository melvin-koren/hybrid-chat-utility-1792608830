[package]
name = "covert_messenger"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
base64 = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[package.metadata.android]
build_targets = ["aarch64-linux-android"]
# Указываем современную версию SDK 34, которая гарантированно предустановлена на серверах GitHub
sdk_targets = [34]

[package.metadata.android]
build_targets = ["aarch64-linux-android"]
target_sdk_version = 34
min_sdk_version = 21
